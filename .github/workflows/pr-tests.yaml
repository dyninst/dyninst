name: PR Tests

# Goal 1: Dyninst builds and can instrument and run a program on its own.
#
# Currently a single distro while the from-source third-party library approach
# proves itself; the remaining images in the rocprofiler-systems CI matrix are
# added once this is green.

on:
  pull_request:
    branches: [dyninst_13]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-24-04:
    name: ubuntu-24.04
    uses: ./.github/workflows/build.yaml
    with:
      name: ubuntu-24.04
      image: dgaliffiamd/rocprofiler-systems:ci-rocm-7.2-ubuntu-24.04
      cc: gcc
      cxx: g++
      build-types: '["RELEASE", "DEBUG", "RELWITHDEBINFO"]'
