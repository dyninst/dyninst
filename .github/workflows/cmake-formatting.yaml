name: CMake Formatting

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ master ]
    paths:
       - '**.cmake'
       - '**CMakeLists.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  cmake-formatting:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip
        python3 -m pip install gersemi

    - name: gersemi
      shell: bash
      run: |
        # The cmake-check and cmake-reformat-diff targets drive this same
        # script, so a contributor's build and this job share one file list
        # and one report.  Calling it directly rather than through the
        # targets keeps the job on a bare runner: 'cmake -P' wants no
        # configured build tree, and so none of Dyninst's dependencies.
        run() {
          cmake -DGERSEMI="$(command -v gersemi)" \
                -DMODE="$1" \
                -DSOURCE_DIR="${GITHUB_WORKSPACE}" \
                -P "${GITHUB_WORKSPACE}/cmake/DyninstRunGersemi.cmake"
        }

        # An 'if' reports the status of the branch it took, not of the
        # condition, so the explicit exit is what makes the step fail.
        if ! run check; then
          echo
          echo
          run diff
          exit 1
        fi
