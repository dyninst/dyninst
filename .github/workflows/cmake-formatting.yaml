name: CMake Formatting

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ master ]
    # The check covers every tracked CMake file, not only the ones a pull
    # request touched, so anything that changes what "formatted" means has
    # to trigger it: the gersemi settings, the pinned gersemi version, and
    # this workflow itself.  cmake/DyninstRunGersemi.cmake is a '.cmake'.
    paths:
       - '**.cmake'
       - '**CMakeLists.txt'
       - '.gersemirc'
       - '.github/workflows/cmake-formatting.yaml'
       - 'docker/dependencies.versions'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  # Don't run the check if the PR is a draft
  check-if-needed:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    steps:
      - shell: bash
        run: true

  cmake-formatting:
    runs-on: ubuntu-latest
    needs: check-if-needed
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip
        # The version lives in docker/dependencies.versions, beside the other
        # pinned dependencies, and cmake/DyninstRunGersemi.cmake reads the same
        # line -- one copy, nothing to keep in step.  Unpinned, pip installs
        # whatever is newest and reformats files this tree is correct for.
        version=$(awk -F: '/^gersemi:/{print $2}' docker/dependencies.versions)
        test -n "$version" || {
          echo "::error::no gersemi version in docker/dependencies.versions"
          exit 1
        }
        python3 -m pip install "gersemi==$version"

    - name: gersemi
      shell: bash
      run: |
        # The cmake-check and cmake-reformat-diff targets drive this same
        # script, so a contributor's build and this job share one file list
        # and one report.  Calling it directly rather than through the
        # targets keeps the job on a bare runner: 'cmake -P' wants no
        # configured build tree, and so none of Dyninst's dependencies.
        run() {
          cmake -DGERSEMI="$(command -v gersemi)" \
                -DMODE="$1" \
                -DSOURCE_DIR="${GITHUB_WORKSPACE}" \
                -P "${GITHUB_WORKSPACE}/cmake/DyninstRunGersemi.cmake"
        }

        # An 'if' reports the status of the branch it took, not of the
        # condition, so the explicit exit is what makes the step fail.
        if ! run check; then
          echo
          echo
          run diff
          exit 1
        fi
